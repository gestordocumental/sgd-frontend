name: Deploy

on:
  push:
    branches: [dev, test, master]

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    name: Deploy — ${{ github.ref_name }}
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || github.ref_name }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@50.42.0

      - name: Inject Railway API URL
        run: |
          test -n "${{ vars.RAILWAY_API_URL }}" || { echo "RAILWAY_API_URL is not set for this environment"; exit 1; }
          SAFE_URL=$(printf '%s' "${{ vars.RAILWAY_API_URL }}" | sed 's/[&|]/\\&/g')
          sed -i "s|__RAILWAY_API_URL__|${SAFE_URL}|g" vercel.json

      - name: Pull Vercel config
        run: vercel pull --yes --environment=${{ github.ref_name == 'master' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ github.ref_name == 'master' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        run: vercel deploy --prebuilt ${{ github.ref_name == 'master' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}
